[project]
name = "enterprise-nervous-system"
version = "0.1.0"
description = "Cross-silo incident resolution swarm — autonomous root-cause analysis"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "ag2[mcp,openai]>=0.4.0",
    "ag2[mcp,anthropic]>=0.4.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "groq",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "anthropic>=0.104.1",
    "tiktoken>=0.7.0",
    "scikit-learn>=1.5.0",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

